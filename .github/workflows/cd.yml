name: CD

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      namespace:
        description: Kubernetes namespace for deployment
        default: default
      release-name:
        description: Helm release name
        default: djblog

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/djblog:${{ github.sha }}
          platforms: linux/amd64

  deploy:
    name: Deploy to Kubernetes via Helm
    needs: build_and_push
    if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config

      - name: Deploy Helm chart
        run: |
          helm upgrade --install ${{ github.event.inputs.release-name || 'djblog' }} ./charts/djblog \
            --namespace ${{ github.event.inputs.namespace || 'default' }} \
            --create-namespace \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/djblog \
            --set image.tag=${{ github.sha }}
