services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: djblogger
      POSTGRES_PASSWORD: tulisanrahasia
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 6379:6379

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: djblog:dev
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      ALLOWED_HOSTS: 127.0.0.1,localhost
      DEBUG: 'True'
    volumes:
      - .:/app:cached
      - staticfiles:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db_data:
  staticfiles:
